# Weekly update pull requests. Each one runs CI like any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        patterns:
          - '@types/*'
          - eslint*
          - '@eslint/*'
          - typescript-eslint
          - prettier
          - vitest
          - turbo
          - tsx
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
